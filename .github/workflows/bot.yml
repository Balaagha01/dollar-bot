name: Check Dollar Price

on:
  workflow_dispatch:
  schedule:
    # هەموو 10 خولەک جارێک لە نێوان 10:00ی بەیانی تا 08:00ی ئێوارە (بەکاتی هەولێر)
    - cron: '*/10 7-17 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pillow

      - name: Run script
        run: |
          python bot.py
