name: Check Dollar Price

on:
  schedule:
    # هەر 10 خولەک جارێک لە نێوان 06:00 تا 16:30 بە کاتی جیهانی UTC
    # (کە دەکاتە 09:00ی بەیانی تا 07:30ی ئێوارە بە کاتی کوردستان)
    - cron: '*/10 6-16 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Dollar Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
